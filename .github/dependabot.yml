# Dependency updates, batched weekly; security updates come as they are found.
version: 2
updates:
  - package-ecosystem: npm
    directory: /sdk-typescript
    schedule: { interval: weekly }
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: npm
    directory: /cli
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /conformance
    schedule: { interval: weekly }
  # The framework examples, one PR a week for all of them. The SDK pin moves with version-lockstep, never here.
  - package-ecosystem: npm
    directories: ["/examples/langchain-typescript"]
    schedule: { interval: weekly }
    ignore:
      - dependency-name: "@airprompter/*"
    groups:
      examples:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /sdk-python
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
