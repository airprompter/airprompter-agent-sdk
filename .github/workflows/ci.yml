name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["protocol/v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - name: Install the conformance runner
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: conformance
      - name: Schemas, examples, semantic rules and vectors
        run: npm test
        working-directory: conformance
      - name: OpenAPI lint
        run: npm run lint:openapi
        working-directory: conformance
      - name: Customer docs link check (every relative link and anchor resolves)
        run: node docs/check-links.mjs
      - name: Every source file opens with a header and a usage example (CONTRIBUTING.md › File headers)
        run: node scripts/check-headers.mjs
      - name: Legacy 0.3.4 vectors and examples are byte-for-byte generated
        # Legacy fixtures keep their original wire version while VERSION names the audience contract.
        run: |
          mkdir -p /tmp/legacy-check
          cp -R protocol /tmp/legacy-check/protocol
          ln -s "$GITHUB_WORKSPACE/conformance" /tmp/legacy-check/conformance
          printf '0.3.4\n' > /tmp/legacy-check/protocol/VERSION
          python3 /tmp/legacy-check/protocol/tools/gen_assignment_vectors.py /tmp/assignment.json
          diff -u protocol/vectors/assignment.json /tmp/assignment.json
          python3 /tmp/legacy-check/protocol/tools/gen_examples.py /tmp/examples >/dev/null
          cp -R protocol/examples /tmp/examples-expected
          rm /tmp/examples-expected/manifest.audiences.json /tmp/examples-expected/heartbeat.request.audiences.json /tmp/examples-expected/heartbeat.response.audiences.json
          rm /tmp/examples-expected/refused/manifest.audience-without-capability.json /tmp/examples-expected/refused/manifest.audience-empty-conditions.json /tmp/examples-expected/refused/heartbeat.request.audience-values.json
          diff -ru /tmp/examples /tmp/examples-expected
          node /tmp/legacy-check/protocol/tools/gen_datastore_vectors.mjs /tmp/datastore.json >/dev/null
          diff -u protocol/vectors/datastore.json /tmp/datastore.json
          python3 /tmp/legacy-check/protocol/tools/gen_spool_vectors.py /tmp/spool >/dev/null
          diff -u protocol/vectors/spool.json /tmp/spool/spool.json
          diff -u protocol/vectors/feedback.json /tmp/spool/feedback.json
      - name: Legacy trust-chain vectors verify with fresh signatures too
        # ECDSA signatures are randomised; generate legacy signatures independently and verify them.
        run: |
          node /tmp/legacy-check/protocol/tools/gen_trust_vectors.mjs /tmp/manifest-verify.json
          TRUST_VECTORS=/tmp/manifest-verify.json npm test --prefix conformance
      - name: Audience fixtures and vectors use their intentional protocol versions
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const current=["protocol/examples/manifest.audiences.json","protocol/examples/heartbeat.request.audiences.json","protocol/examples/heartbeat.response.audiences.json","protocol/examples/refused/manifest.audience-empty-conditions.json","protocol/examples/refused/heartbeat.request.audience-values.json"]; for (const path of current) { const x=JSON.parse(fs.readFileSync(path,"utf8")); const version=x.payload?.protocol ?? x.protocol ?? x.document?.payload?.protocol ?? x.document?.protocol; if (version!=="2.0.0") throw new Error(`${path}: ${version}`); } for (const path of ["protocol/examples/heartbeat.request.audiences.json","protocol/examples/refused/heartbeat.request.audience-values.json","protocol/examples/refused/heartbeat.request.protocol2-without-capability.json"]) { const x=JSON.parse(fs.readFileSync(path,"utf8")); const sdk=x.sdk ?? x.document?.sdk; if(sdk?.version!=="0.5.0") throw new Error(`${path}: SDK ${sdk?.version}`); } const refused="protocol/examples/refused/manifest.audience-without-capability.json"; const x=JSON.parse(fs.readFileSync(refused,"utf8")); if(x.document?.payload?.protocol!=="2.0.0") throw new Error(`${refused}: ${x.document?.payload?.protocol}`); const v=JSON.parse(fs.readFileSync("protocol/vectors/audiences.json","utf8")); if(v.protocol!=="2.0.0") throw new Error(`audiences.json: ${v.protocol}`);'
      - name: A protocol tag names the version in protocol/VERSION
        if: startsWith(github.ref, 'refs/tags/protocol/v')
        run: test "protocol/v$(cat protocol/VERSION)" = "$GITHUB_REF_NAME"
      - name: Legacy fixtures and OpenAPI retain protocol 0.3.4
        run: |
          v=0.3.4
          test "$(node -p "require('./protocol/examples/manifest.json').payload.protocol")" = "$v"
          test "$(node -p "require('./protocol/vectors/assignment.json').protocol")" = "$v"
          test "$(node -p "require('./protocol/vectors/manifest-verify.json').protocol")" = "$v"
          test "$(node -p "require('./protocol/vectors/spool.json').protocol")" = "$v"
          test "$(node -p "require('./protocol/vectors/feedback.json').protocol")" = "$v"
          grep -q "^  version: $v$" protocol/openapi.yaml
      - name: Every protocol change carries a CHANGELOG entry
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" "$HEAD" -- protocol | grep -v '^protocol/CHANGELOG.md$' || true)
          if [ -n "$changed" ] && ! git diff --name-only "$BASE" "$HEAD" -- protocol/CHANGELOG.md | grep -q .; then
            echo "protocol/ changed without a CHANGELOG entry:"; echo "$changed"; exit 1
          fi

  packages:
    # hashFiles() is not available in a job-level `if`, so a tiny job decides
    # which package suites exist yet.
    name: Which packages exist
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      typescript: ${{ steps.detect.outputs.typescript }}
      python: ${{ steps.detect.outputs.python }}
      cli: ${{ steps.detect.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          echo "typescript=$([ -f sdk-typescript/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([ -f sdk-python/pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "cli=$([ -f cli/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  sdk-typescript:
    name: SDK (TypeScript, ${{ matrix.os }})
    needs: packages
    if: needs.packages.outputs.typescript == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk-typescript
      # S10: nine packages in lockstep. Build in dependency order first — the
      # two-copies vector loads the built dist beside the source — then the
      # whole tree as one program, the import direction, the suites, the size
      # budgets, and the compatibility table's freshness.
      - run: npm run build
        working-directory: sdk-typescript
      - run: npm run typecheck
        working-directory: sdk-typescript
      - run: npm test
        working-directory: sdk-typescript
      - run: npm run size
        working-directory: sdk-typescript
      - name: The compatibility table is what the conformance run produces
        run: node scripts/compat-table.mjs --check
        working-directory: sdk-typescript
      - name: Every package installs on its own (a fresh project, one sibling at a time)
        shell: bash
        run: node scripts/install-alone.mjs
        working-directory: sdk-typescript
      - name: The built packages pass the conformance harness through the published adapter contract (S14)
        run: node harness.mjs --adapter adapters/agent-sdk.mjs
        working-directory: conformance

  sdk-python:
    name: SDK (Python ${{ matrix.python }})
    needs: packages
    if: needs.packages.outputs.python == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The cross-language interop test has the TypeScript SDK write a store this SDK must open.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk-typescript
      # S10: eight distributions in lockstep, installed editable in dependency order; the import direction is linted.
      - run: python tools/install_dev.py pyflakes build
        working-directory: sdk-python
      - run: python -m pyflakes packages/*/src tests tools
        working-directory: sdk-python
      - run: python tools/lint_imports.py
        working-directory: sdk-python
      - run: python tools/version_lockstep.py
        working-directory: sdk-python
      - run: python -m pytest -rs
        working-directory: sdk-python
      - name: Every distribution builds (sdist + wheel) into one dist/
        run: python tools/build_all.py
        working-directory: sdk-python
      - name: The interop test ran (not skipped)
        run: python -m pytest tests/test_interop.py -rs 2>&1 | tee /tmp/interop.log && ! grep -q SKIPPED /tmp/interop.log
        working-directory: sdk-python
      - name: The Python SDK passes the conformance harness over JSON lines (S14)
        run: node harness.mjs --adapter-command "python ../examples/conformance-adapter/python/adapter.py"
        working-directory: conformance

  datastore-adapters:
    # T40: the three adapters against live backends — Postgres and Redis as
    # service containers, S3 through moto's server (which enforces If-None-Match
    # and If-Match) — in both languages, plus the cross-language test: rows the
    # TypeScript adapter wrote hydrate a Python runtime through the Python one.
    # The package jobs above skip these suites; here a skip is a failure.
    name: Datastore adapters (live Postgres, Redis, S3)
    needs: packages
    if: needs.packages.outputs.typescript == 'true' && needs.packages.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      AIRPROMPTER_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AIRPROMPTER_TEST_REDIS_URL: redis://localhost:6379
      AIRPROMPTER_TEST_S3_ENDPOINT: http://127.0.0.1:5000
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk-typescript
      - run: python tools/install_dev.py "psycopg[binary]>=3.1" "psycopg2-binary>=2.9" "redis>=5" "boto3>=1.35.70" "moto[server]==5.2.3"
        working-directory: sdk-python
      - name: Start the S3 endpoint (moto)
        run: |
          nohup moto_server -H 127.0.0.1 -p 5000 >/tmp/moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5000/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/moto.log; exit 1
      - name: TypeScript adapters against the live backends (none skipped)
        run: node --import tsx --test test/datastoreAdapters.test.ts 2>&1 | tee /tmp/ts-adapters.log && grep -q "^# skipped 0$" /tmp/ts-adapters.log && grep -q "^# fail 0$" /tmp/ts-adapters.log
        working-directory: sdk-typescript
      - name: Python adapters and the cross-language datastore test against the live backends (none skipped)
        run: python -m pytest tests/test_datastore_adapters.py tests/test_interop.py -rs 2>&1 | tee /tmp/py-adapters.log && ! grep -q SKIPPED /tmp/py-adapters.log
        working-directory: sdk-python

  cli:
    name: CLI (${{ matrix.artifact }})
    needs: packages
    if: needs.packages.outputs.cli == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: airprompter-linux-x64
          - os: macos-latest
            artifact: airprompter-darwin-arm64
          - os: windows-latest
            artifact: airprompter-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24  # current LTS; the executable embeds this runtime
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cli
      # S12: the dev test and the live-conformance step run conformance/live.mjs, which needs the runner's own deps.
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: conformance
      - run: npm run typecheck
        working-directory: cli
      - run: npm test
        working-directory: cli
      - name: Single executable
        run: npm run build:sea -- --out "dist/${{ matrix.artifact }}"
        working-directory: cli
      - name: Binary smoke test
        # The built executable, not node: version, help, keygen (modes, worktree
        # refusal), a verify refusal with its exit code, --json shape, and the
        # rule that the Agent key never comes from argv.
        run: node scripts/smoke.mjs "dist/${{ matrix.artifact }}"
        working-directory: cli
      - name: A bundle for the verify action (S14)
        id: action-fixture
        shell: bash
        run: node scripts/action-fixture.mjs "$RUNNER_TEMP/action-fixture"
        working-directory: cli
      - name: The verify action verifies it (S14)
        id: verify-action
        uses: ./action/verify
        with:
          bundle: ${{ steps.action-fixture.outputs.bundle }}
          org: ${{ steps.action-fixture.outputs.org }}
          agent: ${{ steps.action-fixture.outputs.agent }}
          environment: ${{ steps.action-fixture.outputs.environment }}
          root: ${{ steps.action-fixture.outputs.root }}
          binary: cli/dist/airprompter.cjs
      - name: The action's outputs name the bundle it verified (S14)
        shell: bash
        run: test "${{ steps.verify-action.outputs.ok }}" = "true" && test "${{ steps.verify-action.outputs.generation }}" = "1"
      - name: Live conformance against airprompter dev (S12)
        # The built executable serves the fixture directory; the runner exercises
        # every route with the protocol's schemas and trust chain.
        shell: bash
        run: node scripts/live-conformance.mjs "dist/${{ matrix.artifact }}"
        working-directory: cli
      - name: Size
        shell: bash
        run: ls -l "cli/dist/${{ matrix.artifact }}" | awk '{ printf "%s %.1f MiB\n", $NF, $5/1048576 }'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: cli/dist/${{ matrix.artifact }}
          retention-days: 7

  deploy-manifests:
    name: Deploy manifests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: systemd unit
        # verify checks that ExecStart exists and the env file is readable: stand both in as the install steps would.
        run: |
          sudo install -m 0755 /bin/true /usr/local/bin/airprompter
          sudo install -d /etc/airprompter && sudo install -m 0600 deploy/systemd/airprompterd.env.example /etc/airprompter/airprompterd.env
          systemd-analyze verify deploy/systemd/airprompterd.service
      - name: WinSW service definition is well-formed XML
        # Refresh the index first: the runner image's cached one names package builds the mirror has since dropped (404).
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libxml2-utils >/dev/null && xmllint --noout deploy/windows/airprompterd.xml
      - name: launchd plist is well-formed (plutil runs on macOS; here the XML must at least parse)
        run: xmllint --noout deploy/launchd/com.airprompter.airprompterd.plist
      - name: Kubernetes DaemonSet
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary deploy/kubernetes/daemonset.yaml
      - name: Compose file resolves
        run: AIRPROMPTER_AGENT_KEY=x docker compose -f deploy/docker/docker-compose.yml config >/dev/null
      - name: Sidecar image builds and runs
        run: |
          docker build -f deploy/docker/Dockerfile -t airprompterd:ci .
          docker run --rm airprompterd:ci --version
          # The telemetry daemon runs keyless (shipping nothing) and exits cleanly; a release-serving flag is refused by name.
          docker run --rm airprompterd:ci daemon --org o --agent agt_1 --environment prod --exit-after 1
          code=0; docker run --rm airprompterd:ci daemon --org o --agent agt_1 --environment prod --root /nonexistent.json --exit-after 1 || code=$?; test "$code" -eq 2

  deploy-manifests-macos:
    name: Deploy manifests (launchd)
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: plutil -lint deploy/launchd/com.airprompter.airprompterd.plist
