# Releases. Each package has its own tag prefix and its own job; every job
# produces a signed artifact and an SBOM, and nothing publishes from a
# developer machine:
#
#   protocol/vX.Y.Z        protocol tag — CI conformance only (ci.yml); the
#                          protocol is consumed by pinning the tag, not by a
#                          package.
#   sdk-typescript/vX.Y.Z  npm publish of the nine packages (core, sync,
#                          runtime, telemetry, otel-bridge, the three
#                          datastore adapters, sdk) from one tag, in
#                          dependency order, each with provenance (OIDC; no
#                          npm token in the repository — trusted publishing
#                          on npmjs.com must be configured for every
#                          @airprompter/agent-* package,
#                          @airprompter/otel-bridge and every
#                          @airprompter/datastore-* package). npm registers a
#                          trusted publisher only on a package that already
#                          exists: a NEW package's first version is published
#                          once by hand (`npm publish --access public` from
#                          the tagged commit, after `npm run build`), then
#                          its trusted publisher is added, then the tag is
#                          pushed — this job skips any version already on
#                          the registry, so the hand-published one is left
#                          as it is.
#   sdk-python/vX.Y.Z      PyPI trusted publishing of the eight distributions
#                          (airprompter-agent-core, -sync, -runtime,
#                          -telemetry, airprompter-agent, and
#                          airprompter-datastore-s3, -postgres, -redis) from
#                          one tag; each needs a trusted publisher on PyPI.
#   cli/vX.Y.Z             single-file executables for linux/macos/windows,
#                          cosign keyless signatures, SBOM, GitHub release.
#   conformance/vX.Y.Z     npm publish of @airprompter/protocol-conformance
#                          (the harness with the protocol's vectors bundled
#                          at pack time), with provenance (S14).
#
# Tags are pushed by hand or by tag-release.yml, which then dispatches this
# workflow on the tag (a GITHUB_TOKEN tag push starts no workflow); the publish
# jobs gate on github.ref, so a dispatch on a tag publishes as a push does.
#
# `workflow_dispatch` also runs a dry run: it builds the protocol SBOM, signs it
# keyless with cosign, and uploads the signed artifacts — the release path
# is exercised end to end without publishing anything.

name: Release

on:
  push:
    tags:
      - "sdk-typescript/v*"
      - "sdk-python/v*"
      - "cli/v*"
      - "conformance/v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    name: Dry run — signed protocol SBOM
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: sigstore/cosign-installer@v3
      - name: SBOM of the protocol directory
        uses: anchore/sbom-action@v0
        with:
          path: protocol
          format: spdx-json
          output-file: protocol.spdx.json
          upload-artifact: false
      - name: Sign the SBOM (keyless, Sigstore)
        run: |
          cosign sign-blob --yes --bundle protocol.spdx.json.sigstore protocol.spdx.json
          cosign verify-blob --bundle protocol.spdx.json.sigstore \
            --certificate-identity-regexp '^https://github.com/airprompter/airprompter-agent-sdk/' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            protocol.spdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-sbom-signed
          path: |
            protocol.spdx.json
            protocol.spdx.json.sigstore

  conformance:
    name: Publish @airprompter/protocol-conformance
    if: startsWith(github.ref, 'refs/tags/conformance/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships npm 10, which publishes unauthenticated and gets a 404.
      - run: npm install -g npm@latest
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: conformance
      - name: The protocol's own gate and the harness's suite
        run: npm test
        working-directory: conformance
      - name: Tag matches package.json
        run: test "$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME#conformance/v}"
        working-directory: conformance
      # prepack bundles ../protocol/{vectors,schemas,VERSION}; postpack removes the copy.
      - name: Publish with provenance
        run: npm publish --provenance --access public
        working-directory: conformance
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  npm:
    name: Publish @airprompter/* (nine packages, one tag)
    if: startsWith(github.ref, 'refs/tags/sdk-typescript/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs npm 11.5.1+; Node 22 ships npm 10, which publishes unauthenticated and gets a 404.
      - run: npm install -g npm@latest
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk-typescript
      - run: npm run build
        working-directory: sdk-typescript
      - run: npm test
        working-directory: sdk-typescript
      - name: Tag matches every package.json (one version, lockstep)
        run: |
          v="${GITHUB_REF_NAME#sdk-typescript/v}"
          node scripts/version-lockstep.mjs --expect "$v"
        working-directory: sdk-typescript
      - name: CHANGELOG.md describes this version
        run: |
          v="${GITHUB_REF_NAME#sdk-typescript/v}"
          grep -Eq "^## ${v//./\\.} — " CHANGELOG.md || { echo "CHANGELOG.md has no '## $v — <date>' entry; write one before tagging"; exit 1; }
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: sdk-typescript
          format: spdx-json
          output-file: agent-sdk.spdx.json
      - name: Publish with provenance, in dependency order
        # core first: a sibling's exact pin must resolve on the registry before the sibling is published.
        # A version already on the registry is skipped, so a run that failed part-way can be re-run: without it the
        # re-run dies on the first package it already published, and the rest of the version can never go out.
        run: |
          publish() {
            v=$(node -p "require('./packages/$2/package.json').version")
            if npm view "$1@$v" version >/dev/null 2>&1; then
              echo "$1@$v is already on the registry; skipped"
            else
              npm publish --provenance --access public --workspace "$1"
            fi
          }
          for name in core sync runtime telemetry sdk; do publish "@airprompter/agent-$name" "$name"; done
          # S13: the bridge is optional and pins core; it goes out after core, whatever its position.
          publish "@airprompter/otel-bridge" otel-bridge
          # T40: the datastore adapters are optional and pin sync; they go out after it.
          for adapter in s3 postgres redis; do publish "@airprompter/datastore-$adapter" "datastore-$adapter"; done
        working-directory: sdk-typescript
      - uses: softprops/action-gh-release@v2
        with:
          files: agent-sdk.spdx.json
          generate_release_notes: true

  pypi:
    name: Publish airprompter-agent-* and airprompter-datastore-* (eight distributions, one tag)
    if: startsWith(github.ref, 'refs/tags/sdk-python/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - name: Build every distribution into one dist/ (core, sync, runtime, telemetry, agent, the three datastore adapters)
        run: python tools/build_all.py
        working-directory: sdk-python
      - name: Tag matches every pyproject version (one version, lockstep)
        run: |
          v="${GITHUB_REF_NAME#sdk-python/v}"
          python tools/version_lockstep.py --expect "$v"
        working-directory: sdk-python
      - name: CHANGELOG.md describes this version
        run: |
          v="${GITHUB_REF_NAME#sdk-python/v}"
          grep -Eq "^## ${v//./\\.} — " CHANGELOG.md || { echo "CHANGELOG.md has no '## $v — <date>' entry; write one before tagging"; exit 1; }
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: sdk-python
          format: spdx-json
          output-file: airprompter-agent.spdx.json
      - name: Publish (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk-python/dist
          # A distribution already on PyPI is skipped, so a run that failed part-way can be re-run.
          skip-existing: true
      - uses: softprops/action-gh-release@v2
        with:
          files: airprompter-agent.spdx.json
          generate_release_notes: true

  cli:
    name: Build and sign the CLI
    if: startsWith(github.ref, 'refs/tags/cli/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: airprompter-linux-x64
          - os: ubuntu-24.04-arm
            artifact: airprompter-linux-arm64
          - os: macos-latest
            artifact: airprompter-darwin-arm64
          - os: windows-latest
            artifact: airprompter-windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24  # current LTS; the executable embeds this runtime
      - uses: sigstore/cosign-installer@v3
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cli
      # S12: the dev test runs conformance/live.mjs, which needs the runner's own deps (as CI installs them).
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: conformance
      - run: npm test
        working-directory: cli
      - name: Tag matches package.json
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#cli/v}"
          test "$(node -p "require('./package.json').version")" = "$v"
        working-directory: cli
      - name: Single executable
        run: npm run build:sea -- --out "../dist/${{ matrix.artifact }}"
        working-directory: cli
      - name: Binary smoke test
        run: node scripts/smoke.mjs "../dist/${{ matrix.artifact }}"
        working-directory: cli
      # macOS: Developer ID signature + notarization. An unsigned binary blocks
      # on first run (Gatekeeper), so this is part of the release, not polish.
      # Needs the secrets below; without them the job builds an ad-hoc-signed
      # binary and the release notes say so.
      - name: Developer ID sign and notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE_P12 != ''
        shell: bash
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain"
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "dist/${{ matrix.artifact }}"
          ditto -c -k --keepParent "dist/${{ matrix.artifact }}" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          codesign --verify --strict --verbose=2 "dist/${{ matrix.artifact }}"
          echo "notarized=true" >> "$GITHUB_ENV"
      # Windows: Authenticode. Needs a code-signing certificate (PFX) and its password.
      - name: Authenticode sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE_PFX != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD "dist/${{ matrix.artifact }}"
          & $signtool.FullName verify /pa "dist/${{ matrix.artifact }}"
          "authenticode=true" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Sign (keyless)
        shell: bash
        run: |
          cosign sign-blob --yes --bundle "dist/${{ matrix.artifact }}.sigstore" "dist/${{ matrix.artifact }}"
          sha256sum "dist/${{ matrix.artifact }}" > "dist/${{ matrix.artifact }}.sha256" 2>/dev/null || shasum -a 256 "dist/${{ matrix.artifact }}" > "dist/${{ matrix.artifact }}.sha256"
          {
            echo "artifact=${{ matrix.artifact }}"
            echo "node=$(node --version)"
            echo "size_bytes=$(wc -c < "dist/${{ matrix.artifact }}" | tr -d ' ')"
            echo "platform_signature=${notarized:-${authenticode:-none}}"
          } > "dist/${{ matrix.artifact }}.provenance.txt"
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          path: cli
          format: spdx-json
          output-file: dist/${{ matrix.artifact }}.spdx.json
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
