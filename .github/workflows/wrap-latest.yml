name: Wrappers against the latest provider SDKs

# The framework adapters (frameworks/openai, anthropic, ai-sdk; the Python
# twins and the LiteLLM callback) are built on the provider SDKs' public
# surfaces, which move. Every week the
# wrapper suites run against the LATEST releases of `openai`,
# `@anthropic-ai/sdk`, `ai`, `openai` (Python), `anthropic` and `litellm`
# with recorded responses served through each client's own transport option
# — nothing reaches a provider. A red run here is the early warning that a
# supported range must move. CI proper runs the same suites on the versions
# the workspace pins (`ai` is a pinned devDependency; `openai` and
# `@anthropic-ai/sdk` arrive with the LangChain ones), or skips them. The
# framework examples (examples/) run the same way, on each framework's
# newest release, and once more as published.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript wrappers (latest openai, @anthropic-ai/sdk, ai)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk-typescript
      - name: Install the latest provider releases (not saved)
        run: npm i --no-save --no-audit --no-fund openai@latest @anthropic-ai/sdk@latest ai@latest
        working-directory: sdk-typescript
      - name: Report what was tested
        run: |
          for p in openai @anthropic-ai/sdk ai @ai-sdk/provider; do
            printf '%s %s\n' "$p" "$(node -p "JSON.parse(require('fs').readFileSync('node_modules/$p/package.json','utf8')).version")"
          done
        working-directory: sdk-typescript
      - name: Wrapper suites against the real clients
        run: WRAP_LIVE=1 node --import tsx --test test/frameworks/live.test.ts test/frameworks/openai.test.ts test/frameworks/anthropic.test.ts test/frameworks/aiSdk.test.ts
        working-directory: sdk-typescript

  examples:
    # The framework examples (examples/ci/run.mjs) against the same fake provider, twice: with each framework package
    # at its newest release in place of its pin, so a framework change that breaks a copied example shows up here; and
    # exactly as a developer copies one (the pins from npm, the newest released CLI), which skips with a warning while
    # the pin is not on npm yet.
    name: Examples (latest framework releases, and as published)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.21.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk-typescript
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cli
      - name: Each example against the newest framework releases
        run: node examples/ci/run.mjs --latest
      - name: Each example as a developer copies it (its pins from npm, the newest released CLI)
        # Its own result whatever --latest found.
        if: ${{ !cancelled() }}
        run: node examples/ci/run.mjs --published
        env:
          GITHUB_TOKEN: ${{ github.token }}

  python:
    name: Python wrappers (latest openai, anthropic, litellm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The repository's own installer (every distribution editable, the test extras): `pip install -e ".[test]"` from
      # sdk-python/ resolved the old workspace and left pytest out.
      - run: python tools/install_dev.py
        working-directory: sdk-python
      - name: Install the latest provider releases
        run: python -m pip install --upgrade openai anthropic litellm
        working-directory: sdk-python
      - name: Report what was tested
        run: python -m pip show openai anthropic litellm httpx httpx2 2>/dev/null | grep -E '^(Name|Version)'
      - name: Wrapper suites against the real clients
        run: WRAP_LIVE=1 python -m pytest -rs tests/test_frameworks_live.py tests/test_frameworks_direct.py tests/test_litellm.py
        working-directory: sdk-python

  httpx-canary:
    # httpx is the default transport behind the SDK's own `Transport` (core/http.py), in no public signature, and the
    # SDK bounds it below 1.0. Every week the default transport runs on the newest httpx: the newest release (red here
    # means the bound must move or the default must change) and, informational, the newest prerelease (httpx 1.0 dev
    # is another library; it shows how far off it is). Only the suites that drive the default transport run: the test
    # doubles elsewhere are httpx-shaped and would go red on httpx itself.
    name: httpx canary (${{ matrix.httpx }})
    strategy:
      fail-fast: false
      matrix:
        httpx: [newest, prerelease]
    continue-on-error: ${{ matrix.httpx == 'prerelease' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # test_dev_registry runs `airprompter dev` from source: a real registry over real HTTP.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk-typescript
      - run: python tools/install_dev.py
        working-directory: sdk-python
      - name: Install the newest httpx past the SDK's bound
        run: python -m pip install --upgrade ${{ matrix.httpx == 'prerelease' && '--pre' || '' }} httpx
        working-directory: sdk-python
      - name: Report what was tested
        run: python -m pip show httpx | grep -E '^(Name|Version)'
      - name: The default transport, alone and under a real registry
        run: python -m pytest -rs tests/test_transport.py tests/test_dev_registry.py
        working-directory: sdk-python
