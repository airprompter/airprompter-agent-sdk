name: Adapters against the latest framework releases

# AIR-2233: every framework adapter (frameworks/openai, anthropic, ai-sdk,
# langchain; the Python twins and the LiteLLM callback) is built on a
# framework's public surface, which moves. Every week the same recorded
# fixtures CI runs on the pinned versions (conformance/frameworks/fixtures)
# run against each framework's NEWEST release, one job per framework and
# language, named for the version it ran: the plan job reads the newest
# version from npm or PyPI first, so a job's name and what it installs
# cannot differ. Nothing reaches a provider. A red job is the early warning
# that a fixture or an adapter must move. The framework examples (examples/)
# run the same way, on each framework's newest release, and once more as
# published.
#
# EXPECTED RED on the first run: the fixtures were recorded on the versions
# they pin, so every job whose newest release has moved past its pin is
# expected to fail. That is the signal this workflow exists to give, not a
# regression. Re-recording the fixtures on the new releases is AIR-2560.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: The newest release of each framework
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Into a variable first: a plan that fails fails this step, not the matrix job on an empty value.
      - id: plan
        run: |
          matrix=$(node conformance/frameworks/pins.mjs --matrix)
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  framework:
    needs: plan
    name: ${{ matrix.framework }}@${{ matrix.version }} (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The fixtures' frameworkVersion pins give way: each case names the version it ran instead.
      AIRPROMPTER_FRAMEWORKS_LATEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: matrix.language == 'ts'
        working-directory: sdk-typescript
      - run: npm run build
        if: matrix.language == 'ts'
        working-directory: sdk-typescript
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: conformance
      - name: Install ${{ matrix.package }}@${{ matrix.version }} ${{ matrix.with }} (not saved)
        if: matrix.language == 'ts'
        run: npm i --no-save --no-audit --no-fund "$PACKAGE@$VERSION" $WITH
        env: { PACKAGE: "${{ matrix.package }}", VERSION: "${{ matrix.version }}", WITH: "${{ matrix.with }}" }
        working-directory: sdk-typescript
      - name: Install ${{ matrix.package }}==${{ matrix.version }} ${{ matrix.with }}, the other frameworks beside it
        if: matrix.language == 'py'
        # The other frameworks (the live suites import them) by name only, so a pin of theirs never blocks this one's newest.
        run: |
          python tools/install_dev.py
          python -m pip install "$PACKAGE==$VERSION" $WITH $(node ../conformance/frameworks/pins.mjs py --names --except "$PACKAGE $WITH_NAMES")
        env: { PACKAGE: "${{ matrix.package }}", VERSION: "${{ matrix.version }}", WITH: "${{ matrix.with }}", WITH_NAMES: "${{ matrix.withNames }}" }
        working-directory: sdk-python
      - name: What ran
        run: |
          if [ "$LANGUAGE" = ts ]; then (cd sdk-typescript && npm ls --depth=0 "$PACKAGE" $WITH_NAMES || true); else python -m pip list 2>/dev/null | grep -iE "^(openai|anthropic|litellm|langchain|langgraph|pydantic|httpx)" || true; fi
        env: { LANGUAGE: "${{ matrix.language }}", PACKAGE: "${{ matrix.package }}", WITH_NAMES: "${{ matrix.withNames }}" }
      - name: ${{ matrix.framework }} fixtures on ${{ matrix.package }} ${{ matrix.version }}
        if: matrix.language == 'ts'
        run: node harness.mjs --adapter adapters/agent-sdk.mjs --only frameworks --framework "${{ matrix.framework }}"
        working-directory: conformance
      - name: ${{ matrix.framework }} fixtures on ${{ matrix.package }} ${{ matrix.version }}
        if: matrix.language == 'py'
        run: node harness.mjs --adapter-command "python ../examples/conformance-adapter/python/adapter.py" --only frameworks --framework "${{ matrix.framework }}"
        working-directory: conformance
      # The real-client suites the fixtures do not drive (helper streams, async clients), on the same newest release.
      - name: The live wrapper suites on ${{ matrix.package }} ${{ matrix.version }}
        if: matrix.language == 'ts' && contains(fromJSON('["openai","anthropic","ai-sdk"]'), matrix.framework)
        run: WRAP_LIVE=1 node --import tsx --test test/frameworks/live.test.ts test/frameworks/openai.test.ts test/frameworks/anthropic.test.ts test/frameworks/aiSdk.test.ts
        working-directory: sdk-typescript
      - name: The live wrapper suites on ${{ matrix.package }} ${{ matrix.version }}
        if: matrix.language == 'py'
        run: WRAP_LIVE=1 python -m pytest -rs tests/test_frameworks_live.py tests/test_frameworks_direct.py tests/test_litellm.py
        working-directory: sdk-python

  examples:
    # The framework examples (examples/ci/run.mjs) against the same fake provider, twice: with each framework package
    # at its newest release in place of its pin, so a framework change that breaks a copied example shows up here; and
    # exactly as a developer copies one (the pins from npm, the newest released CLI), which skips with a warning while
    # the pin is not on npm yet.
    name: Examples (latest framework releases, and as published)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g npm@11.21.2
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk-typescript
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: cli
      - name: Each example against the newest framework releases
        run: node examples/ci/run.mjs --latest
      - name: Each example as a developer copies it (its pins from npm, the newest released CLI)
        # Its own result whatever --latest found.
        if: ${{ !cancelled() }}
        run: node examples/ci/run.mjs --published
        env:
          GITHUB_TOKEN: ${{ github.token }}

  httpx-canary:
    # httpx is the default transport behind the SDK's own `Transport` (core/http.py), in no public signature, and the
    # SDK bounds it below 1.0. Every week the default transport runs on the newest httpx: the newest release (red here
    # means the bound must move or the default must change) and, informational, the newest prerelease (httpx 1.0 dev
    # is another library; it shows how far off it is). Only the suites that drive the default transport run: the test
    # doubles elsewhere are httpx-shaped and would go red on httpx itself.
    name: httpx canary (${{ matrix.httpx }})
    strategy:
      fail-fast: false
      matrix:
        httpx: [newest, prerelease]
    continue-on-error: ${{ matrix.httpx == 'prerelease' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # test_dev_registry runs `airprompter dev` from source: a real registry over real HTTP.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: sdk-typescript
      - run: python tools/install_dev.py
        working-directory: sdk-python
      - name: Install the newest httpx past the SDK's bound
        run: python -m pip install --upgrade ${{ matrix.httpx == 'prerelease' && '--pre' || '' }} httpx
        working-directory: sdk-python
      - name: Report what was tested
        run: python -m pip show httpx | grep -E '^(Name|Version)'
      - name: The default transport, alone and under a real registry
        run: python -m pytest -rs tests/test_transport.py tests/test_dev_registry.py
        working-directory: sdk-python
