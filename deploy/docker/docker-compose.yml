# airprompterd as a telemetry sidecar: the daemon and the application share
# the state volume. The daemon publishes daemon.json there naming its spool
# folder; the app's SDK (same stateDir) writes its segments into that folder
# with a manifest each and leaves the upload to the daemon. The app loads
# its release itself — its own store, the datastore or a vendored bundle —
# never from the daemon (protocol/daemon.md). Both run as the same uid.
#
#   AIRPROMPTER_AGENT_KEY=apa_live_… docker compose -f deploy/docker/docker-compose.yml up
#
# The sidecar is the value when the app holds no Agent key (it hydrates
# from the datastore or a bundle) or when several processes share a host:
# one daemon ships everyone's telemetry under one key.

services:
  airprompterd:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: airprompterd
    user: "10001:10001"
    command:
      - daemon
      - --org
      - org_…
      - --agent
      - agt_…
      - --environment
      - prod
      - --json
    environment:
      AIRPROMPTER_AGENT_KEY: ${AIRPROMPTER_AGENT_KEY:?set AIRPROMPTER_AGENT_KEY}
      XDG_STATE_HOME: /var/lib/airprompter
    volumes:
      - airprompter-state:/var/lib/airprompter
    healthcheck:
      # Exits 1 when daemon.json is missing or its heartbeat is over ten minutes old.
      test: ["CMD", "airprompter", "status", "--agent", "agt_…", "--environment", "prod", "--require-daemon", "--json"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  app:
    image: your-application:latest
    user: "10001:10001"
    environment:
      # The SDK finds <XDG_STATE_HOME>/airprompter/<agent>/<env>/daemon.json, writes its spool where it
      # says and uploads nothing itself; without the daemon a process with a key uploads its own.
      XDG_STATE_HOME: /var/lib/airprompter
    volumes:
      - airprompter-state:/var/lib/airprompter
    depends_on:
      airprompterd:
        condition: service_started

volumes:
  airprompter-state:
