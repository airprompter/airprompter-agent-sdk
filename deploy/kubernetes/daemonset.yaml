# airprompterd on every node: the node's telemetry daemon (protocol/daemon.md).
# It publishes daemon.json on a hostPath the application pods mount
# read-write; the pods write their spool segments into the folder it names,
# with a manifest each, and the daemon uploads them under the Agent key.
# The pods load their releases themselves — their own store, the customer's
# datastore or a vendored bundle — never from the daemon, and a pod that
# hydrates from the datastore needs no Agent key at all.
#
#   kubectl create secret generic airprompterd --from-literal=AIRPROMPTER_AGENT_KEY=apa_live_…
#   kubectl apply -f deploy/kubernetes/daemonset.yaml
#
# Application pods: mount the same hostPath at the same mountPath, run as the
# same runAsUser (10001), and start the SDK with stateDir
# "/var/lib/airprompter" (or AIRPROMPTER_SPOOL_DIR / telemetry.spoolDir
# pointing at the daemon's folder). If the daemon is not there, a pod with
# a key uploads its own spool — the DaemonSet is an optimization.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: airprompterd
  labels:
    app.kubernetes.io/name: airprompterd
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: airprompterd
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airprompterd
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: airprompterd
          image: ghcr.io/airprompter/airprompterd:0.1.0
          args:
            - daemon
            - --org
            - org_…
            - --agent
            - agt_…
            - --environment
            - prod
            - --json
          env:
            - name: XDG_STATE_HOME
              value: /var/lib/airprompter
            - name: AIRPROMPTER_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: airprompterd
                  key: AIRPROMPTER_AGENT_KEY
          volumeMounts:
            - name: state
              mountPath: /var/lib/airprompter
          livenessProbe:
            exec:
              # Exits 1 when daemon.json is missing or its heartbeat is over ten minutes old.
              command: ["airprompter", "status", "--agent", "agt_…", "--environment", "prod", "--require-daemon", "--json"]
            initialDelaySeconds: 10
            periodSeconds: 60
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: state
          hostPath:
            path: /var/lib/airprompter
            type: DirectoryOrCreate
      terminationGracePeriodSeconds: 20
