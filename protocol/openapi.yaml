openapi: 3.1.0
info:
  title: AirPrompter Agent routes (customer-v1)
  version: 0.3.2
  summary: The routes an agent runtime calls. Pull only; the control plane never opens a connection to you.
  description: |
    Every route is called by the customer's runtime over outbound HTTPS with an
    **Agent key** bound to one agent and one target. A key bound to `staging`
    cannot read `prod`; a key with `agent.bundle.read` cannot spend the
    organization's allowance (`agent.run` is a separate key kind). No Agent
    key can seal, promote, unlock or countersign anything.

    Each operation carries `x-airprompter-status`: `shipped` (served by the
    hosted service today), `planned` (the contract is fixed, the route lands
    with the named ticket). SDKs may implement planned routes behind a
    protocol-range check; the server answers `404` until it ships.

    Error bodies are `{ "error": string, "details"?: object }` with the HTTP
    status carrying the class; `429` carries `Retry-After`.
  license:
    name: BSD-3-Clause
    identifier: BSD-3-Clause
servers:
  - url: https://api.airprompter.com
    description: Hosted service
  - url: https://{host}
    description: A self-hosted registry implementing this protocol (Hangar)
    variables:
      host:
        default: registry.example.com
security:
  - agentKey: []
tags:
  - name: distribution
    description: Manifest, payloads and the edge pointer (§4)
  - name: telemetry
    description: Heartbeat and the upload grant (§9.1)
  - name: countersign
    description: Customer countersignatures (§6.3)
  - name: managed
    description: Managed execution — AirPrompter holds the key and calls the model (§18)

paths:
  /v1/agents/{agentId}/targets/{target}/manifest:
    get:
      operationId: getAgentManifest
      tags: [distribution]
      summary: Signed manifest for the target
      x-airprompter-status: shipped
      x-airprompter-ticket: AIR-1936
      x-airprompter-scope: agent.bundle.read
      description: |
        Returns the current signed manifest. `ETag` is the sha256 of the
        stored envelope (a rollback is a new generation and therefore a new
        envelope even when it names an older release); send it back as
        `If-None-Match` for a `304`. `x-agent-generation` carries the
        generation on both. `?wait=<seconds>` opts into a long poll of up to
        25 s, held only while the runtime already has the current envelope (or
        nothing is promoted yet); it is bounded by a per-organization
        concurrency cap and refused with `429` above it. Idle runtimes should
        poll the edge pointer (`edgePointerUrl` from the heartbeat) and call
        this only when the generation moved.
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/target"
        - name: If-None-Match
          in: header
          schema:
            $ref: "schemas/manifest.schema.json#/$defs/sha256"
        - name: wait
          in: query
          description: Long-poll seconds, 1–25. Omit for an immediate answer.
          schema:
            type: integer
            minimum: 1
            maximum: 25
      responses:
        "200":
          description: The current manifest
          headers:
            ETag:
              description: sha256 of the stored envelope, `sha256:<hex>`.
              schema:
                $ref: "schemas/manifest.schema.json#/$defs/sha256"
            Cache-Control:
              schema:
                type: string
                const: no-store
            x-agent-generation:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "schemas/manifest.schema.json"
        "304":
          description: The envelope in `If-None-Match` is still current
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No release has been promoted to this target yet, or the key's binding does not cover it (indistinguishable by design)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/agents/{agentId}/payloads/{contentHash}:
    get:
      operationId: getAgentPayload
      tags: [distribution]
      summary: Content-addressed, immutable payload bytes
      x-airprompter-status: shipped
      x-airprompter-ticket: AIR-1936
      x-airprompter-scope: agent.bundle.read
      description: |
        Bytes for one content hash referenced by a manifest the key may read.
        The route serves only a hash the key target's CURRENT manifest
        references — hashes are unguessable, but that is not the
        authorization. Bodies up to 16 KiB are returned inline
        (`x-content-hash` names the hash); larger ones `302` to a five-minute
        presigned URL, minted only after the bytes were read and verified. The runtime verifies `sha256` of the bytes
        against `contentHash` after download and again after decrypt-on-load.
      parameters:
        - $ref: "#/components/parameters/agentId"
        - name: contentHash
          in: path
          required: true
          schema:
            $ref: "schemas/manifest.schema.json#/$defs/sha256"
      responses:
        "200":
          description: Payload bytes
          headers:
            Cache-Control:
              schema:
                type: string
                const: "private, max-age=31536000, immutable"
            Content-Length:
              schema:
                type: integer
                maximum: 16384
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "302":
          description: Bytes above 16 KiB — follow `Location` (presigned, expires within minutes; verify the hash exactly as for an inline body)
          headers:
            Location:
              schema:
                type: string
                format: uri
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Not referenced by any release this key may read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agents/{agentId}/targets/{target}/heartbeat:
    post:
      operationId: postAgentHeartbeat
      tags: [telemetry]
      summary: Report instance state; receive the cadence (and, later, the upload grant)
      x-airprompter-status: shipped
      x-airprompter-ticket: AIR-1939
      x-airprompter-scope: agent.telemetry.write
      description: |
        The daemon (or an SDK without a daemon) reports what the instance is
        running and how (AIR-1939): its identity and class, apply state, the
        generations it holds, its catalogue, lease, spool depth, the unlock
        requests it has surfaced and what it is refusing under a Freeze. The
        answer carries the cadence the server holds it to (`heartbeatIntervalSeconds`,
        clamped to 30–3600; three misses expire the instance from the fleet
        view), `expiresAt`, the suggested poll interval and the upload interval.
        The presigned S3 POST grant for the spool (AIR-1942) rides here when it
        ships; until then `uploadGrant` is absent and the spool holds. Telemetry
        bytes never pass through this route.

        Per key, an environment holds at most 500 live instances (D57): the
        first heartbeat of an instance past that cap is refused with
        `403 instance_cap_reached` and never recorded.
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/target"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "schemas/heartbeat.schema.json#/$defs/request"
      responses:
        "200":
          description: Accepted; a grant is present unless throttled
          content:
            application/json:
              schema:
                $ref: "schemas/heartbeat.schema.json#/$defs/response"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/agents/{agentId}/targets/{target}/releases/{releaseDigest}/countersign:
    post:
      operationId: postReleaseCountersign
      tags: [countersign]
      summary: Upload a customer countersignature for a release
      x-airprompter-status: planned
      x-airprompter-ticket: AIR-1940
      x-airprompter-scope: agent.countersign.write
      description: |
        A customer release engineer signs the `releaseDigest` with a key from
        the customer's countersign key-set (§6.3) and posts it here; the
        signature is attached to the release and carried in every manifest that
        can activate it (D58). The server verifies the signature against the
        countersign public keys registered on the target before accepting it.
        A release is identified by `(target, releaseDigest)`: identical pins
        sealed for two targets are two releases, each countersigned on its own.
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/target"
        - name: releaseDigest
          in: path
          required: true
          schema:
            $ref: "schemas/manifest.schema.json#/$defs/sha256"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "schemas/manifest.schema.json#/$defs/countersignature"
      responses:
        "201":
          description: Countersignature recorded
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [releaseDigest, countersignatures]
                properties:
                  releaseDigest:
                    $ref: "schemas/manifest.schema.json#/$defs/sha256"
                  countersignatures:
                    type: array
                    items:
                      $ref: "schemas/manifest.schema.json#/$defs/countersignature"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such release on this target for a key that may see it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Signature does not verify against a registered countersign key, or the digest in the body differs from the path
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agents/{agentId}/targets/{target}/run:
    post:
      operationId: postAgentRun
      tags: [managed]
      summary: Run a slot on a managed target
      x-airprompter-status: shipped
      x-airprompter-ticket: AIR-1949
      x-airprompter-scope: agent.run
      x-airprompter-transport: |
        Served from the execution stack's function URL behind CloudFront, not
        the API host; the base URL is the environment's run URL. Pass
        `stream: true` (or `Accept: text/event-stream`) for SSE: zero or more
        `delta` frames (`{"delta": "…"}`), then exactly one `done` frame (the
        RunResponse) or one `error` frame (the Error body) on the 200. The
        edge closes a connection silent for 60 s; a JSON (non-streaming) run
        is silent until the model finishes, so SDKs stream under the hood.
      description: |
        Managed execution (§18): AirPrompter renders the active version of the
        slot, calls the model with a platform-held key, meters the run against
        the organization's allowance, and returns the output. The customer
        passes `subjectHash` (never the subject) so experiment assignment
        matches client mode exactly (assignment-hash.md): the salt comes from
        `GET …/slots`. Output checks declared on the slot run server-side;
        `runRef` lets `ap.feedback()` attach quality signals later. This is a
        separate key kind from distribution keys and is never co-granted by
        default. `Idempotency-Key` (header or body) makes a retry answer from
        a 10-minute encrypted cache; an organization may keep only the fact of
        execution instead, in which case a retry is `409 already_executed`.
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/target"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunRequest"
      responses:
        "200":
          description: The run completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunResponse"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: The organization's allowance is exhausted and auto-charge is off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: No such slot on the active release
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: A declared output check failed and the slot is configured to refuse
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503":
          description: The model was unavailable on both the global and the regional profile; retry after `Retry-After`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agents/{agentId}/targets/{target}/slots:
    get:
      operationId: getAgentRunSlots
      tags: [managed]
      summary: The hosted catalogue for a managed target
      x-airprompter-status: shipped
      x-airprompter-ticket: AIR-1953
      x-airprompter-scope: agent.run
      description: |
        What a run key may ask for: the promoted release's slot tags, kinds,
        models, declared variables, workflow step ids, and the experiment's
        salt, subject key and arm names — so `subjectHash` can be computed
        locally exactly as client mode computes it. No payload references,
        no bytes, no directives. Same function URL as the run route; hosted
        environments only (`403 target_not_hosted` otherwise).
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/target"
      responses:
        "200":
          description: The catalogue
          headers:
            x-agent-generation:
              schema: { type: integer }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunSlots"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: Nothing is promoted to this environment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/agents/{agentId}/targets/{target}/feedback:
    post:
      operationId: postAgentRunFeedback
      tags: [managed]
      summary: File feedback against a hosted run's runRef
      x-airprompter-status: shipped
      x-airprompter-ticket: AIR-1960
      x-airprompter-scope: agent.run
      description: |
        `ap.feedback(runRef, signals)` as a bare HTTP call, from any process
        or language that kept the `runRef` a run returned. The ref must
        verify and name this key's agent and target; the signals go through
        the catalogue (`feedback-signals.schema.json`) — numbers, booleans and
        the declared enums only, free text is rejected by name — and what
        survives joins the run's arm window as `outcomes[signal] += {n, sum}`
        in the minute it was filed (late arrival allowed; the gate reads arms,
        not minutes). Same function URL as the run route.
      parameters:
        - $ref: "#/components/parameters/agentId"
        - $ref: "#/components/parameters/target"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runRef, signals]
              properties:
                runRef: { type: string, maxLength: 512 }
                signals:
                  $ref: "feedback-signals.schema.json"
      responses:
        "202":
          description: What was accepted and what was rejected, and why
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, attributedTo, rejected]
                properties:
                  accepted: { type: boolean }
                  attributedTo:
                    type: [object, "null"]
                    properties:
                      tag: { type: string }
                      versionId: { type: string }
                      arm: { type: string }
                      minute: { type: string, format: date-time }
                  rejected:
                    type: object
                    additionalProperties:
                      type: string
                      enum: [invalid_value, invalid_name, reserved_name, unknown_signal, needs_slot_enum]
        "400":
          description: A malformed body, or a runRef that does not verify or names another agent or target (`invalid_run_ref`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/agents/{agentId}/openai/chat/completions:
    post:
      operationId: postAgentCompatOpenAiChatCompletions
      tags: [managed]
      summary: OpenAI Chat Completions shape over a hosted target
      x-airprompter-status: shipped
      x-airprompter-ticket: AIR-1962
      x-airprompter-scope: agent.run
      description: |
        The OpenAI SDK pointed at `baseURL …/v1/agents/{agentId}/openai` with a
        run key. `model` must be `slot:<tag>`; the release's template is the
        system prompt; the one user turn goes into the prompt's end-user
        variable; other variables through `airprompter.variables`. The run,
        the meter, the record and the judge sample are `/run`'s own; the
        answer is a chat completion (or `chat.completion.chunk` events then
        `[DONE]`) with `X-AirPrompter-RunRef`. The mapping and every refusal:
        `compatible-endpoints.md`. The target is the key's own.
      parameters:
        - $ref: "#/components/parameters/agentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatOpenAiChatRequest"
      responses:
        "200":
          description: An OpenAI chat completion (JSON), or `text/event-stream` chunks
          headers:
            X-AirPrompter-RunRef: { schema: { type: string }, description: The run reference (JSON answers; streams carry it on the usage chunk) }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatProviderObject" }
        "400":
          description: A mapping refusal (`model_not_a_slot`, `system_message_not_allowed`, `unsupported_messages`, `unsupported_parameter`, `no_end_user_variable`) or a `/run` refusal, in OpenAI's error shape
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatOpenAiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/agents/{agentId}/openai/responses:
    post:
      operationId: postAgentCompatOpenAiResponses
      tags: [managed]
      summary: OpenAI Responses shape over a hosted target
      x-airprompter-status: shipped
      x-airprompter-ticket: AIR-1962
      x-airprompter-scope: agent.run
      description: |
        As the Chat Completions shape, for `responses.create` (and the SDK's
        `responses.stream()` helper): `input` is the one user turn;
        `instructions` is refused. `compatible-endpoints.md`.
      parameters:
        - $ref: "#/components/parameters/agentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatOpenAiResponsesRequest"
      responses:
        "200":
          description: An OpenAI response object (JSON), or the Responses stream events
          headers:
            X-AirPrompter-RunRef: { schema: { type: string }, description: The run reference (JSON answers; streams carry it on `response.completed`) }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatProviderObject" }
        "400":
          description: A mapping or `/run` refusal in OpenAI's error shape
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatOpenAiError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /v1/agents/{agentId}/anthropic/v1/messages:
    post:
      operationId: postAgentCompatAnthropicMessages
      tags: [managed]
      summary: Anthropic Messages shape over a hosted target
      x-airprompter-status: shipped
      x-airprompter-ticket: AIR-1962
      x-airprompter-scope: agent.run
      description: |
        The Anthropic SDK pointed at `baseURL …/v1/agents/{agentId}/anthropic`
        with a run key (`x-api-key`). `model` must be `slot:<tag>`;
        `max_tokens` is required; `system` is refused (the release's template
        is the system prompt); the one user turn goes into the prompt's
        end-user variable; `metadata.user_id` is the sticky subject. The
        answer is a message (JSON) or the Messages stream events, with
        `X-AirPrompter-RunRef`. `compatible-endpoints.md`.
      parameters:
        - $ref: "#/components/parameters/agentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompatAnthropicMessagesRequest"
      responses:
        "200":
          description: An Anthropic message (JSON), or the Messages stream events
          headers:
            X-AirPrompter-RunRef: { schema: { type: string }, description: The run reference (JSON answers; streams carry it on `message_stop`) }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatProviderObject" }
        "400":
          description: A mapping refusal (incl. `max_tokens_required`) or a `/run` refusal, in Anthropic's error shape
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompatAnthropicError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    agentKey:
      type: http
      scheme: bearer
      description: An Agent key minted in the Agent's Keys tab, bound to one agent and one target, with scopes granted per key.
  parameters:
    agentId:
      name: agentId
      in: path
      required: true
      schema:
        $ref: "schemas/manifest.schema.json#/$defs/identifier"
    target:
      name: target
      in: path
      required: true
      schema:
        $ref: "schemas/manifest.schema.json#/$defs/target"
  responses:
    BadRequest:
      description: The request did not validate against the schema
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed or revoked key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The key is not bound to this agent and target, or lacks the scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Throttled; honour `Retry-After`
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    CompatExtension:
      type: object
      description: The `airprompter` extension a compatible body may carry — everything the provider shape has no field for.
      additionalProperties: false
      properties:
        variables:
          type: object
          additionalProperties: { type: string, maxLength: 65536 }
        subjectHash: { type: string, pattern: "^[0-9a-f]{64}$" }
        stepId: { type: string }
        idempotencyKey: { type: string, pattern: "^[A-Za-z0-9_-]{16,64}$" }
        metadata:
          type: object
          additionalProperties: { type: string, maxLength: 128 }
    CompatOpenAiChatRequest:
      type: object
      description: An OpenAI Chat Completions request; `model` is `slot:<tag>`; one user turn; the rest per compatible-endpoints.md.
      required: [model, messages]
      properties:
        model: { type: string, pattern: "^slot:" }
        messages: { type: array, items: { type: object } }
        stream: { type: boolean }
        max_completion_tokens: { type: integer, minimum: 1 }
        max_tokens: { type: integer, minimum: 1 }
        user: { type: string }
        airprompter: { $ref: "#/components/schemas/CompatExtension" }
      additionalProperties: true
    CompatOpenAiResponsesRequest:
      type: object
      description: An OpenAI Responses request; `model` is `slot:<tag>`; `input` is the one user turn (a string, or one user message of `input_text` parts).
      required: [model, input]
      properties:
        model: { type: string, pattern: "^slot:" }
        input: {}
        stream: { type: boolean }
        max_output_tokens: { type: integer, minimum: 1 }
        user: { type: string }
        airprompter: { $ref: "#/components/schemas/CompatExtension" }
      additionalProperties: true
    CompatAnthropicMessagesRequest:
      type: object
      description: An Anthropic Messages request; `model` is `slot:<tag>`; `max_tokens` required; one user turn; `system` refused.
      required: [model, max_tokens, messages]
      properties:
        model: { type: string, pattern: "^slot:" }
        max_tokens: { type: integer, minimum: 1 }
        messages: { type: array, items: { type: object } }
        stream: { type: boolean }
        metadata:
          type: object
          properties:
            user_id: { type: string }
        airprompter: { $ref: "#/components/schemas/CompatExtension" }
      additionalProperties: true
    CompatProviderObject:
      type: object
      description: The provider's own response object (a chat completion, a response, a message) with an `airprompter` field beside the standard ones.
      required: [airprompter]
      properties:
        airprompter:
          type: object
          required: [runId, runRef]
          properties:
            runId: { type: string }
            runRef: { type: string }
      additionalProperties: true
    CompatOpenAiError:
      type: object
      required: [error, airprompter]
      properties:
        error:
          type: object
          required: [message, type, code]
          properties:
            message: { type: string }
            type: { type: string }
            param: { type: [string, "null"] }
            code: { type: string }
        airprompter:
          type: object
          required: [code]
          properties:
            code: { type: string }
            detail: { type: string }
    CompatAnthropicError:
      type: object
      required: [type, error, airprompter]
      properties:
        type: { type: string, enum: [error] }
        error:
          type: object
          required: [type, message]
          properties:
            type: { type: string }
            message: { type: string }
        airprompter:
          type: object
          required: [code]
          properties:
            code: { type: string }
            detail: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: object
          additionalProperties: true
    RunSlots:
      type: object
      additionalProperties: false
      required: [agentId, target, generation, releaseDigest, slots, experiment]
      properties:
        agentId:
          $ref: "schemas/manifest.schema.json#/$defs/identifier"
        target:
          type: string
          enum: [dev, staging, prod]
        generation:
          type: integer
          minimum: 1
        releaseDigest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        slots:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [tag, kind, model, variables, steps]
            properties:
              tag:
                $ref: "schemas/manifest.schema.json#/$defs/slotTag"
              kind:
                type: string
                enum: [prompt, workflow]
              model:
                $ref: "schemas/manifest.schema.json#/$defs/modelId"
              variables:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [name, required, trust]
                  properties:
                    name: { type: string, pattern: "^[a-zA-Z0-9_.-]{1,64}$" }
                    required: { type: boolean }
                    trust: { type: string }
              inference:
                description: "0.3.1: how the model is called for the slot, as the release sealed it — what a hosted run uses; the caller's own values are ignored."
                $ref: "schemas/manifest.schema.json#/$defs/inference"
              steps:
                description: "Workflow slots list their step ids in order (0.3.2: each with its own settings when it has any); prompt slots carry null."
                type: array
                nullable: true
                items:
                  type: object
                  additionalProperties: false
                  required: [stepId]
                  properties:
                    stepId: { type: string }
                    inference:
                      $ref: "schemas/manifest.schema.json#/$defs/inference"
        experiment:
          description: The running experiment, or null; the salt is what `subjectHash` is computed with.
          type: object
          nullable: true
          additionalProperties: false
          required: [salt, subjectKey, arms]
          properties:
            salt: { type: string, pattern: "^[A-Za-z0-9_-]{22,86}$" }
            subjectKey: { type: string, enum: [request, instance] }
            arms:
              type: array
              items: { type: string }
    RunRequest:
      type: object
      additionalProperties: false
      required: [tag, variables]
      properties:
        tag:
          $ref: "schemas/manifest.schema.json#/$defs/slotTag"
        variables:
          description: Values for the slot's declared variables. `end_user` values are rendered only inside their declared delimiters.
          type: object
          maxProperties: 64
          propertyNames:
            pattern: "^[a-zA-Z0-9_.-]{1,64}$"
          additionalProperties:
            type: string
            maxLength: 65536
        subjectHash:
          description: hex(SHA-256(salt ‖ subject)) computed locally; never the subject.
          type: string
          pattern: "^[0-9a-f]{64}$"
        idempotencyKey:
          type: string
          pattern: "^[A-Za-z0-9_-]{16,64}$"
        stream:
          description: "Answer as SSE (`delta`* then `done` | `error`); `Accept: text/event-stream` does the same."
          type: boolean
        stepId:
          description: A workflow slot's step to run; the customer executes its tools between steps.
          type: string
          pattern: "^[a-z0-9]+(?:[._-][a-z0-9]+)*#[1-9][0-9]{0,2}$"
        maxOutputTokens:
          description: The run's output ceiling (default 1024, at most 8192); the reserve is sized from it.
          type: integer
          minimum: 1
          maximum: 8192
        metadata:
          description: Content-free correlation the customer keeps; echoed on the response, never stored.
          type: object
          maxProperties: 16
          propertyNames:
            pattern: "^[a-zA-Z0-9_.-]{1,32}$"
          additionalProperties:
            type: string
            maxLength: 128
    RunResponse:
      type: object
      additionalProperties: false
      required: [runId, runRef, output, model, versionId, arm, generation, usage, latencyMs, priceMicros, priceBookRevision, stopReason, source]
      properties:
        runId:
          type: string
        runRef:
          description: Opaque reference for `ap.feedback()`; carries no content.
          type: string
          pattern: "^[A-Za-z0-9_-]{16,128}$"
        output:
          type: string
        model:
          $ref: "schemas/manifest.schema.json#/$defs/modelId"
        versionId:
          $ref: "schemas/manifest.schema.json#/$defs/identifier"
        arm:
          type: string
        generation:
          type: integer
          minimum: 1
        usage:
          type: object
          additionalProperties: false
          required: [inputTokens, cachedInputTokens, outputTokens]
          properties:
            inputTokens: { type: integer, minimum: 0 }
            cachedInputTokens: { type: integer, minimum: 0 }
            outputTokens: { type: integer, minimum: 0 }
        latencyMs:
          type: integer
          minimum: 0
        priceMicros:
          description: What the run cost the organization, in USD micros on the stamped price-book revision.
          type: integer
          minimum: 0
        priceBookRevision:
          type: string
        stopReason:
          type: string
          enum: [end_turn, max_tokens, stop_sequence, cancelled, unknown]
        source:
          description: "`replayed` when the idempotency cache answered."
          type: string
          enum: [executed, replayed]
        metadata:
          type: object
          additionalProperties:
            type: string
        outputChecks:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [check, passed]
            properties:
              check: { type: string, maxLength: 64 }
              passed: { type: boolean }
