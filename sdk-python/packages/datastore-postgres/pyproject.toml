[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "airprompter-datastore-postgres"
version = "0.4.1"
description = "The AirPrompter release datastore over one PostgreSQL table: a KvStore with INSERT … ON CONFLICT and versioned UPDATEs, for kv_release_datastore. Bring your own driver (psycopg 3, psycopg2, a psycopg_pool)."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "AirPrompter" }]
keywords = ["airprompter", "prompts", "llm", "agent", "datastore", "postgres", "postgresql"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
# The client library is the application's: the adapter imports none, and the extras below only name a known-good one.
dependencies = [
  "airprompter-agent-sync==0.4.1",
]

[project.optional-dependencies]
psycopg = ["psycopg>=3.1"]
psycopg2 = ["psycopg2-binary>=2.9"]

[project.urls]
Homepage = "https://github.com/airprompter/airprompter-agent-sdk"
Source = "https://github.com/airprompter/airprompter-agent-sdk/tree/main/sdk-python/packages/datastore-postgres"
Protocol = "https://github.com/airprompter/airprompter-agent-sdk/blob/main/protocol/datastore-format.md"
Changelog = "https://github.com/airprompter/airprompter-agent-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/airprompter/airprompter-agent-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/airprompter_datastore_postgres"]

[tool.hatch.build.targets.sdist]
include = ["src/airprompter_datastore_postgres", "README.md"]
