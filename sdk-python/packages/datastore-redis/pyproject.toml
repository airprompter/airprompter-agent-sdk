[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "airprompter-datastore-redis"
version = "0.2.15"
description = "The AirPrompter release datastore over Redis or Valkey: a KvStore with atomic Lua conditional writes and a sorted-set index, for kv_release_datastore. Bring your own client (redis-py)."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "AirPrompter" }]
keywords = ["airprompter", "prompts", "llm", "agent", "datastore", "redis", "valkey"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
# The client library is the application's: the adapter imports none, and the extras below only name a known-good one.
dependencies = [
  "airprompter-agent-sync==0.2.15",
]

[project.optional-dependencies]
redis = ["redis>=5"]

[project.urls]
Homepage = "https://github.com/airprompter/airprompter-agent-sdk"
Source = "https://github.com/airprompter/airprompter-agent-sdk/tree/main/sdk-python/packages/datastore-redis"
Protocol = "https://github.com/airprompter/airprompter-agent-sdk/blob/main/protocol/datastore-format.md"
Changelog = "https://github.com/airprompter/airprompter-agent-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/airprompter/airprompter-agent-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/airprompter_datastore_redis"]

[tool.hatch.build.targets.sdist]
include = ["src/airprompter_datastore_redis", "README.md"]
