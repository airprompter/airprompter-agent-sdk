[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "airprompter-agent-runtime"
version = "0.1.0"
description = "Serve a verified AirPrompter agent release: slot resolution under the ramp and any retreat, rendered text with run references, provider wrappers, and the hosted-execution client. Renders and assigns over a bundle the customer loads with no store, daemon or network."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "AirPrompter" }]
keywords = ["airprompter", "prompts", "llm", "agent", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "airprompter-agent-core==0.1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Provider wrappers observe these lazily; nothing here imports them.
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
litellm = ["litellm>=1.50"]

[project.urls]
Homepage = "https://github.com/airprompter/airprompter-agent-sdk"
Source = "https://github.com/airprompter/airprompter-agent-sdk/tree/main/sdk-python/packages/runtime"
Protocol = "https://github.com/airprompter/airprompter-agent-sdk/tree/main/protocol"

[tool.hatch.build.targets.wheel]
packages = ["src/airprompter_agent_runtime"]

[tool.hatch.build.targets.sdist]
include = ["src/airprompter_agent_runtime", "README.md"]
