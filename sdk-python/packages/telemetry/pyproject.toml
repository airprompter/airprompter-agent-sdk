[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "airprompter-agent-telemetry"
version = "0.2.12"
description = "The content-free telemetry spool and its uploader for AirPrompter agents: minute windows as append-only segments (or in memory on serverless), the host budget, and direct-to-object-store upload under a grant."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
authors = [{ name = "AirPrompter" }]
keywords = ["airprompter", "prompts", "llm", "agent", "governance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "airprompter-agent-core==0.2.12",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/airprompter/airprompter-agent-sdk"
Source = "https://github.com/airprompter/airprompter-agent-sdk/tree/main/sdk-python/packages/telemetry"
Protocol = "https://github.com/airprompter/airprompter-agent-sdk/tree/main/protocol"
Changelog = "https://github.com/airprompter/airprompter-agent-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/airprompter/airprompter-agent-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/airprompter_agent_telemetry"]

[tool.hatch.build.targets.sdist]
include = ["src/airprompter_agent_telemetry", "README.md"]
